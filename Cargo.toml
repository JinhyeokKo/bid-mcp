[package]
name = "bid-mcp"
version = "0.1.0"
edition = "2024"
description = "나라장터(G2B) 및 기업마당(Bizinfo) 공공사업·지원사업 통합 조회 MCP 서버"

[dependencies]
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
chrono = "0.4"
anyhow = "1.0"